name: build-dmg

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

# 仅发布到 hanximeng/ani-rss，严禁推送到 wushuo894/ani-rss
permissions:
  contents: write

# 与 build 工作流共用队列，避免同一 tag 的 Release 并发冲突
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Build with Project
        run: |
          bash ./package.sh
          version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f pom.xml)
          echo "version=v$version" >> $GITHUB_ENV
      - name: Create DMG
        run: |
          bash ./ani-rss-application/target/ani-rss-macos-main/create-dmg.sh
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.version }}
          body_path: UPDATE.md
          tag_name: ${{ env.version }}
          append_body: false
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            ./ani-rss-application/target/ani-rss-macos-main/ani-rss.dmg
