name: build

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 仅发布到 hanximeng/ani-rss（Release / Docker Hub / ghcr.io）
# 严禁向 wushuo894/ani-rss 推送任何内容
permissions:
  contents: write
  packages: write

# 与 build-dmg 工作流共用队列，避免同一 tag 的 Release 并发冲突
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Build with Project
        run: |
          bash ./package.sh
          version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f pom.xml)
          echo "version=v$version" >> $GITHUB_ENV
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.version }}
          body_path: UPDATE.md
          tag_name: ${{ env.version }}
          append_body: false
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            ./ani-rss-application/target/ani-rss.jar
            ./ani-rss-application/target/ani-rss.exe
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image (temurin)
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            hanximeng/ani-rss:latest
            ghcr.io/hanximeng/ani-rss:latest
            hanximeng/ani-rss:${{ env.version }}
            ghcr.io/hanximeng/ani-rss:${{ env.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push Docker image (openj9)
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./docker/Dockerfile-openj9
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            hanximeng/ani-rss:openj9
            ghcr.io/hanximeng/ani-rss:openj9
            hanximeng/ani-rss:${{ env.version }}-openj9
            ghcr.io/hanximeng/ani-rss:${{ env.version }}-openj9
          cache-from: type=gha
          cache-to: type=gha,mode=max
